name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Wrapper and Build APK
      run: |
        # البحث عن المجلد الذي يحتوي على build.gradle والعمل منه
        TARGET_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
        cd "$TARGET_DIR"
        
        # إنشاء ملف gradlew تلقائياً إذا لم يكن موجوداً
        gradle wrapper
        chmod +x gradlew
        
        # بناء الـ APK
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
